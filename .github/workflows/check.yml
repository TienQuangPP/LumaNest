name: Check LumaNest
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install -r requirements-ml.txt --index-url https://download.pytorch.org/whl/cpu
      - run: New-Item -ItemType Directory -Force -Path .cache | Out-Null
      - run: python -m pytest -q --basetemp=.cache/pytest-ci
      - shell: powershell
        run: ./desktop/build.ps1
      - run: python scripts/package_release.py --windows
